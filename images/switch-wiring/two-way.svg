<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img"><title>双控：两个位置控制同一盏灯</title><rect width="1080" height="490" fill="white"/><g fill="#243448" font-family="Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="25">双控：两个位置控制同一盏灯</text><text x="30" y="82" font-size="17">两端都接通联络线 1 时灯亮；拨动任一开关，灯的亮灭状态改变。</text><rect x="170" y="140" width="185" height="200" rx="10" fill="#f2f5f9" stroke="#ccd4df"/><rect x="690" y="140" width="185" height="200" rx="10" fill="#f2f5f9" stroke="#ccd4df"/><text x="190" y="125" font-size="20">双控开关 A</text><text x="710" y="125" font-size="20">双控开关 B</text><polyline points="65,240 215,240" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="246" font-size="20">L</text><polyline points="215,240 315,190" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="315,190 735,190" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="315,290 735,290" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="835,240 735,190" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="835,240 930,240" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="955" cy="240" r="22" fill="#fff0a0" stroke="#48596b" stroke-width="2"/><polyline points="943,228 967,252" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="943,252 967,228" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="977,240 1020,240" fill="none" stroke="#2367ad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="1025" y="246" font-size="20">N</text><text x="465" y="176" font-size="17">联络线 1</text><text x="465" y="315" font-size="17">联络线 2</text><circle cx="215" cy="240" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="315" cy="190" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="315" cy="290" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="735" cy="190" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="735" cy="290" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="835" cy="240" r="5" fill="white" stroke="#48596b" stroke-width="2"/><text x="190" y="270" font-size="14">COM</text><text x="813" y="270" font-size="14">COM</text><text x="315" y="216" font-size="14">L1</text><text x="315" y="278" font-size="14">L2</text><text x="706" y="216" font-size="14">L1</text><text x="706" y="278" font-size="14">L2</text><text x="30" y="390" font-size="17">零线 N 直接接灯具；两根联络线都不能直接当作零线。</text><text x="30" y="448" font-size="15">原理示意：只画灯控相关线路，PE 未画出；线色仅用于区分功能。</text><text x="30" y="473" font-size="15">市电操作须断电、验电；端子定义以产品说明书为准。</text></g></svg>