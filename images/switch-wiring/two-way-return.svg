<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="630" viewBox="0 0 1080 630" role="img"><title>另一种双控布线：灯回线返回同侧底盒</title><rect width="1080" height="630" fill="white"/><g fill="#243448" font-family="Microsoft YaHei, sans-serif"><text x="30" y="42" font-size="25">另一种双控布线：灯回线返回同侧底盒</text><text x="30" y="82" font-size="17">电源、灯回线在同一侧底盒：电气原理不变，额外导线用于返回灯具。</text><rect x="120" y="135" width="300" height="320" rx="10" fill="#f2f5f9" stroke="#ccd4df"/><rect x="680" y="135" width="270" height="320" rx="10" fill="#f2f5f9" stroke="#ccd4df"/><text x="140" y="165" font-size="17">底盒 A：电源、灯回线所在侧</text><text x="700" y="165" font-size="17">底盒 B：远端开关</text><polyline points="50,275 195,275" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="35" y="255" font-size="17">火线 L</text><polyline points="195,275 350,215" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="350,215 740,215" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="350,335 740,335" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="865,275 740,215" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="865,275 920,275 920,410 250,410 250,515 400,515" fill="none" stroke="#bd3932" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="475" y="203" font-size="17">联络线 1</text><text x="475" y="358" font-size="17">联络线 2</text><text x="440" y="439" font-size="17">灯回线：接远端 COM，不是零线</text><circle cx="425" cy="515" r="22" fill="#fff0a0" stroke="#48596b" stroke-width="2"/><polyline points="413,503 437,527" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="413,527 437,503" fill="none" stroke="#48596b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="447,515 550,515" fill="none" stroke="#2367ad" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="560" y="521" font-size="17">零线 N（直接到灯具）</text><circle cx="195" cy="275" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="350" cy="215" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="350" cy="335" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="740" cy="215" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="740" cy="335" r="5" fill="white" stroke="#48596b" stroke-width="2"/><circle cx="865" cy="275" r="5" fill="white" stroke="#48596b" stroke-width="2"/><text x="160" y="305" font-size="14">COM</text><text x="850" y="305" font-size="14">COM</text><text x="326" y="197" font-size="14">L1</text><text x="326" y="361" font-size="14">L2</text><text x="724" y="197" font-size="14">L1</text><text x="724" y="361" font-size="14">L2</text><text x="30" y="588" font-size="15">原理示意：只画灯控相关线路，PE 未画出；线色仅用于区分功能。</text><text x="30" y="613" font-size="15">市电操作须断电、验电；端子定义以产品说明书为准。</text></g></svg>